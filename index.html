<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>My Tasks</title>
<style>
*{box-sizing:border-box}
:root{--bg:#000;--panel:#0b0b0b;--panel2:#151515;--text:#fff;--muted:#888;--border:#333;--accent:#fff;--accentText:#000}
body{margin:0;padding:20px;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;transition:.3s}
.app{max-width:760px;margin:auto}.header,.section-header,.progress-top,.calendar-nav{display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{font-size:32px;margin:0}.date{color:var(--muted);font-size:14px;margin-top:5px}h2{font-size:23px;margin:0 0 10px}
button{border:0;border-radius:9px;padding:10px 15px;background:var(--accent);color:var(--accentText);font-size:16px;cursor:pointer;transition:.15s}
button:active{transform:scale(.96)}button:hover{opacity:.85}.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--border)}
.progress-box,.panel{margin:20px 0 30px;padding:18px;border:1px solid var(--border);border-radius:14px;background:var(--panel)}
.progress-number{font-weight:bold}.progress-percent,.section-count{color:var(--muted);font-size:14px}
.progress-bar{height:10px;background:var(--panel2);border-radius:10px;overflow:hidden;margin-top:12px}.progress-fill{height:100%;width:0;background:var(--accent);transition:width .4s}
.section{margin-top:35px}.divider{height:1px;background:var(--border);margin:30px 0}
.task{display:flex;align-items:center;gap:14px;padding:15px 10px;border-radius:10px;cursor:pointer;transition:.2s}
.task:hover{background:var(--panel2)}.task:active{transform:scale(.98)}
.checkbox{width:27px;height:27px;min-width:27px;border:2px solid #666;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:.2s}
.task.completed .checkbox{background:var(--accent);border-color:var(--accent)}.task.completed .checkbox:after{content:"✓";color:var(--accentText);font-weight:bold}
.task.completed{opacity:.45;animation:complete .3s}.task.completed .task-name{text-decoration:line-through}.task-name{font-size:20px;line-height:1.35;flex:1}
.streak{color:var(--muted);font-size:13px;white-space:nowrap}
.empty{color:var(--muted);padding:12px 10px}
.task-info{flex:1;min-width:0}
.task-description{font-size:14px;color:var(--muted);margin-top:3px;line-height:1.35}
input,select{width:100%;padding:11px;border-radius:7px;border:1px solid #555;background:var(--panel2);color:var(--text);font-size:16px}
label{display:block;margin:15px 0 7px}.hidden{display:none!important}
.form-buttons,.toolbar{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}.weekday-container{display:flex;flex-wrap:wrap;gap:8px}.weekday{border:1px solid #555;padding:8px 10px;border-radius:7px}.weekday input{width:auto}
.upcoming-item,.history-item{padding:11px 8px;border-bottom:1px solid var(--border)}.history-item{display:flex;justify-content:space-between;gap:10px}
.delete-button{background:var(--panel2);color:#aaa;padding:6px 9px;font-size:13px}
.undo{display:none;position:sticky;bottom:12px;z-index:4;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:0 8px 30px #0008}
.undo.show{display:flex;animation:slide .25s}.toast-box{position:fixed;right:15px;bottom:15px;z-index:20;display:flex;flex-direction:column;gap:8px}.toast{padding:13px 16px;border-radius:12px;background:var(--panel);border:1px solid var(--border);box-shadow:0 8px 30px #0008;animation:pop .3s;max-width:330px}
.achievement-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.achievement{padding:14px;border:1px solid var(--border);border-radius:12px;background:var(--panel)}
.achievement.locked{opacity:.38}.achievement.unlocked{border-color:var(--accent);animation:pop .3s}.achievement-icon{font-size:25px}.achievement-title{font-weight:bold;margin-top:4px}.achievement-desc{font-size:13px;color:var(--muted);margin-top:3px}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0 15px}.stat{padding:12px;border:1px solid var(--border);border-radius:10px;text-align:center}.stat b{display:block;font-size:21px}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.cal-head{text-align:center;color:var(--muted);font-size:12px;padding:5px}.cal-day{min-height:62px;border:1px solid var(--border);border-radius:9px;padding:6px;cursor:pointer}.cal-day:hover{background:var(--panel2)}.cal-day.other{opacity:.3}.cal-day.today{outline:2px solid var(--accent)}.cal-day.selected{background:var(--accent);color:var(--accentText)}
.cal-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin:4px 2px}.selected .cal-dot{background:var(--accentText)}
.day-details{display:none;margin-top:12px;padding:12px;background:var(--panel2);border-radius:10px}.day-details.show{display:block;animation:slide .2s}
.modal{display:none;position:fixed;inset:0;background:#000b;z-index:10;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.modal-box{max-width:600px;width:100%;max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:20px;animation:pop .25s}
.theme-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.theme-btn{text-align:left;background:var(--panel2);color:var(--text);border:1px solid var(--border)}.theme-btn.active{outline:2px solid var(--accent)}
@keyframes complete{0%{transform:scale(1)}50%{transform:scale(1.04)}100%{transform:scale(1)}}@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}@keyframes slide{0%{transform:translateY(12px);opacity:0}100%{transform:translateY(0);opacity:1}}
@media(max-width:500px){body{padding:15px}h1{font-size:28px}.task-name{font-size:18px}.achievement-grid,.theme-grid{grid-template-columns:1fr}.cal-day{min-height:50px}}
</style>
</head>
<body>
<div class="app">
<div class="header"><div><h1>MY TASKS</h1><div id="dateDisplay" class="date"></div></div>
<div class="form-buttons" style="margin:0"><button id="themeButton">🎨 Theme</button><button id="addButton">+ Add</button></div></div>

<div class="progress-box"><div class="progress-top"><b id="progressNumber">0 / 0</b><span id="progressPercent" class="progress-percent">0%</span></div><div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div></div>

<div id="addPanel" class="panel hidden"><h2>Add Task</h2>
<label>Task name</label><input id="taskName" placeholder="Enter task name">

<label>Description</label>
<input id="taskDescription" placeholder="Optional description">
<label>Type</label><select id="taskType"><option value="recurring">Recurring task</option><option value="one-time">One-time reminder</option></select>
<div id="dateArea" class="hidden"><label>Due date</label><input id="dueDate" type="date"></div>
<div id="recurringArea"><label>Repeat</label><select id="frequency"><option value="daily">Every day</option><option value="weekly">Every week</option><option value="every-days">Every X days</option><option value="specific-days">Specific days</option></select>
<div id="everyDaysArea" class="hidden"><label>Every how many days?</label><input id="everyDays" type="number" min="1" value="2"></div>
<div id="specificDaysArea" class="hidden"><label>Days</label><div class="weekday-container">
<label class="weekday"><input type="checkbox" value="0">Sun</label><label class="weekday"><input type="checkbox" value="1">Mon</label><label class="weekday"><input type="checkbox" value="2">Tue</label><label class="weekday"><input type="checkbox" value="3">Wed</label><label class="weekday"><input type="checkbox" value="4">Thu</label><label class="weekday"><input type="checkbox" value="5">Fri</label><label class="weekday"><input type="checkbox" value="6">Sat</label>
</div></div></div><div class="form-buttons"><button id="saveTaskButton">Save</button><button id="cancelButton" class="secondary">Cancel</button></div></div>

<div class="section"><div class="section-header"><h2>TODAY</h2><span id="todayCount" class="section-count"></span></div><div id="dailyTasks"></div></div>
<div class="divider"></div>
<div class="section"><div class="section-header"><h2>WEEKLY</h2><span id="weeklyCount" class="section-count"></span></div><div id="weeklyTasks"></div></div>
<div class="divider"></div>
<div class="section"><div class="section-header"><h2>CERTAIN DAYS</h2><span id="specificCount" class="section-count"></span></div><div id="specificTasks"></div></div>
<div class="divider"></div>
<div class="section"><h2>CUSTOM</h2><div id="customTasks"></div></div>
<div class="divider"></div>
<div class="section"><h2>REMINDERS</h2><div id="reminderTasks"></div></div>
<div class="divider"></div>
<div class="section"><h2>UPCOMING</h2><div id="upcomingTasks"></div></div>
<div class="divider"></div>

<div class="section"><h2>CALENDAR & HISTORY</h2>
<div class="calendar-nav"><button id="prevMonth" class="secondary">‹</button><b id="calendarTitle"></b><button id="nextMonth" class="secondary">›</button></div>
<div id="calendar" class="calendar"></div><div id="dayDetails" class="day-details"></div>
<div class="toolbar"><input id="historySearch" placeholder="Search history..."><select id="historyFilter"><option value="all">All</option><option value="completed">Completed</option><option value="missed">Missed</option></select></div>
<div id="history"></div></div>
<div class="divider"></div>

<div class="section"><div class="section-header"><h2>ACHIEVEMENTS 🏆</h2><span id="achievementCount" class="section-count"></span></div>
<div id="stats" class="stat-grid"></div><div id="achievements" class="achievement-grid"></div></div>

<div id="undoBar" class="undo"><span id="undoText">Last action</span><button id="undoButton">↩ Undo</button></div>
</div>
<div id="themeModal" class="modal"><div class="modal-box"><div class="section-header"><h2>THEMES 🎨</h2><button id="closeTheme" class="secondary">Close</button></div><p class="date">Your choice is saved automatically.</p><div id="themeGrid" class="theme-grid"></div></div></div>
<div id="toastBox" class="toast-box"></div>

<script>
const originalTasks=[
{id:"bible",name:"Bible",frequency:"daily"},
{id:"deo",name:"Deo",frequency:"daily"},
{id:"backflip",name:"Backflip + OUTSIDE",frequency:"weekly"},
{id:"workout",name:"Work out + drums",frequency:"weekly"},
{id:"cq",name:"CQ",frequency:"weekly"},
{id:"piano-weekly",name:"Piano",frequency:"weekly"},
{id:"code",name:"Code",frequency:"weekly"},
{id:"shower",name:"SHOWER",frequency:"specific-days",days:[2,4,6]}
];

const themes={
"Midnight":{bg:"#000",panel:"#0b0b0b",panel2:"#151515",text:"#fff",muted:"#888",border:"#333",accent:"#fff",accentText:"#000"},
"Ocean":{bg:"#06121c",panel:"#0a1d2b",panel2:"#102a3b",text:"#e8f7ff",muted:"#8eb4c9",border:"#24485c",accent:"#5ddcff",accentText:"#001018"},
"Forest":{bg:"#07110a",panel:"#0d1c11",panel2:"#142619",text:"#effff1",muted:"#91ad96",border:"#2b4831",accent:"#72e28a",accentText:"#061008"},
"Purple":{bg:"#10091a",panel:"#191025",panel2:"#241634",text:"#f7efff",muted:"#aa92bd",border:"#49325e",accent:"#d18cff",accentText:"#160820"},
"Sunset":{bg:"#180b08",panel:"#24100c",panel2:"#321712",text:"#fff4ed",muted:"#c09a8d",border:"#5a3027",accent:"#ff9a68",accentText:"#1b0803"},
"Rose":{bg:"#17090f",panel:"#250e18",panel2:"#341421",text:"#fff0f5",muted:"#c49baa",border:"#58303e",accent:"#ff79a8",accentText:"#21050f"},
"Light":{bg:"#f5f5f5",panel:"#fff",panel2:"#e9e9e9",text:"#111",muted:"#666",border:"#ccc",accent:"#111",accentText:"#fff"}
};

const achievements=[
["first","🌱","First Step","Complete your first task.",s=>s.total>=1],
["ten","🔟","Getting Started","Complete 10 tasks.",s=>s.total>=10],
["fifty","⭐","On a Roll","Complete 50 tasks.",s=>s.total>=50],
["hundred","💯","Century","Complete 100 tasks.",s=>s.total>=100],
["twohundred","🚀","Machine","Complete 200 tasks.",s=>s.total>=200],
["streak3","🔥","3-Day Fire","Reach a 3-day daily streak.",s=>s.bestDaily>=3],
["streak7","🔥","Week of Fire","Reach a 7-day daily streak.",s=>s.bestDaily>=7],
["streak30","🔥","Unstoppable","Reach a 30-day daily streak.",s=>s.bestDaily>=30],
["weekly4","📅","Month Strong","Reach a 4-week weekly streak.",s=>s.bestWeekly>=4],
["perfect","🏆","Perfect Day","Complete every due task in one day.",s=>s.perfectDays>=1],
["perfect7","👑","Perfect Week","Have 7 perfect days.",s=>s.perfectDays>=7],
["momentum","⚡","Momentum","Complete 3 tasks in one day.",s=>s.maxDay>=3],
["sweep","🎯","Clean Sweep","Complete every currently due task.",s=>s.cleanSweep>=1],
["shower","🚿","Fresh","Complete a shower task.",s=>s.shower>=1],
["code","💻","Builder","Complete Code.",s=>s.code>=1],
["bible","📖","Consistent","Complete Bible.",s=>s.bible>=1],
["piano","🎹","Musician","Complete Piano.",s=>s.piano>=1],
["cq","🧩","Quest Complete","Complete CQ.",s=>s.cq>=1],
["weekend","🗓️","Weekend Warrior","Complete a weekend task.",s=>s.weekend>=1],
["comeback","↩️","Second Chance","Use Undo at least once.",s=>s.undos>=1]
];

function dateString(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function dateFromString(s){return new Date(s+"T00:00:00")}
function weekString(d=new Date()){let x=new Date(d),day=x.getDay();x.setDate(x.getDate()+(day===0?-6:1-day));return dateString(x)}
function daysBetween(a,b){return Math.floor((b-a)/86400000)}
function read(key,fallback){try{return JSON.parse(localStorage.getItem(key)||JSON.stringify(fallback))}catch{return fallback}}
function write(key,value){localStorage.setItem(key,JSON.stringify(value))}
function customTasks(){return read("customTasks",[])}
function history(){return read("taskHistory",{})}
function removedTasks(){return read("removedTasks",[])}
function allRecurring(){return [...originalTasks.filter(t=>!removedTasks().includes(t.id)),...customTasks().filter(t=>t.type!=="one-time")]}

function occurrence(t,d=new Date()){return t.frequency==="weekly"?weekString(d):dateString(d)}
function due(t,d=new Date()){
if(t.frequency==="daily"||t.frequency==="weekly")return true;
if(t.frequency==="specific-days")return t.days.includes(d.getDay());
if(t.frequency==="every-days"){if(!t.startDate)return false;let n=daysBetween(dateFromString(t.startDate),dateFromString(dateString(d)));return n>=0&&n%t.interval===0}
return false
}
function hkey(t,d=new Date()){return t.id+"|"+occurrence(t,d)}
function completed(t,d=new Date()){return !!history()[hkey(t,d)]}

let lastAction=null;
function toggle(t){
if(completed(t)){let h=history();delete h[hkey(t)];write("taskHistory",h);toast("Unchecked "+t.name)}
else{let h=history();h[hkey(t)]={taskId:t.id,name:t.name,occurrence:occurrence(t),completedOn:dateString()};write("taskHistory",h);
lastAction={id:t.id,key:hkey(t),name:t.name};localStorage.setItem("undo","1");toast("✓ "+t.name);checkAchievements()}
render();
}

function removeTask(t){
if(t.id.startsWith("custom-")){
write("customTasks",customTasks().filter(q=>q.id!==t.id));
}else{
let a=removedTasks();
if(!a.includes(t.id))a.push(t.id);
write("removedTasks",a);
}
render();
toast(t.name+" removed");
}

document.getElementById("undoButton").onclick=()=>{
if(!lastAction)return;let h=history();delete h[lastAction.key];write("taskHistory",h);
localStorage.removeItem("undo");localStorage.setItem("undoCount",Number(localStorage.getItem("undoCount")||0)+1);
toast("↩ Undid "+lastAction.name);lastAction=null;render();
};

function undoBar(){let x=document.getElementById("undoBar"),show=localStorage.getItem("undo")==="1";x.classList.toggle("show",show);document.getElementById("undoText").textContent=lastAction?`Last: ${lastAction.name}`:"Last action"}

function streak(t){
let h=history(),n=0,d=new Date();
if(t.frequency==="daily")while(h[hkey(t,d)]){n++;d.setDate(d.getDate()-1)}
if(t.frequency==="weekly")while(h[hkey(t,d)]){n++;d.setDate(d.getDate()-7)}
return n
}

function taskElement(t){
let e=document.createElement("div");
e.className="task"+(completed(t)?" completed":"");

let c=document.createElement("div");
c.className="checkbox";

let info=document.createElement("div");
info.className="task-info";

let n=document.createElement("div");
n.className="task-name";
n.textContent=t.name;
info.append(n);

if(t.description){
let desc=document.createElement("div");
desc.className="task-description";
desc.textContent=t.description;
info.append(desc);
}

e.append(c,info);

let s=streak(t);
if(s>1){
let z=document.createElement("span");
z.className="streak";
z.textContent="🔥 "+s;
e.append(z);
}

let b=document.createElement("button");
b.className="delete-button";
b.textContent="Remove";
e.append(b);

e.onclick=()=>toggle(t);
b.onclick=x=>{
x.stopPropagation();
removeTask(t);
};

return e
}

function reminderElement(t){
let e=document.createElement("div");e.className="task";let c=document.createElement("div");c.className="checkbox";let n=document.createElement("div");n.className="task-name";n.textContent=`${t.name} — due ${t.dueDate}`;
let b=document.createElement("button");b.className="delete-button";b.textContent="Delete";e.append(c,n,b);
b.onclick=x=>{x.stopPropagation();write("customTasks",customTasks().filter(q=>q.id!==t.id));render();toast("Reminder removed")};return e
}

function empty(c,msg){if(!c.children.length){let e=document.createElement("div");e.className="empty";e.textContent=msg;c.append(e)}}

function render(){
let d=document.getElementById("dailyTasks"),w=document.getElementById("weeklyTasks"),s=document.getElementById("specificTasks"),c=document.getElementById("customTasks"),r=document.getElementById("reminderTasks");
[d,w,s,c,r].forEach(x=>x.innerHTML="");
allRecurring().forEach(t=>{if(!due(t))return;let e=taskElement(t);if(t.frequency==="daily")d.append(e);else if(t.frequency==="weekly")w.append(e);else s.append(e)});
customTasks().forEach(t=>{if(t.type==="one-time"){if(t.dueDate<=dateString())r.append(reminderElement(t))}else if(due(t))c.append(taskElement(t))});
empty(d,"Nothing here.");empty(w,"Nothing here.");empty(s,"Nothing here today.");empty(c,"No custom tasks due.");empty(r,"No reminders.");
counts();progress();upcoming();historyView();calendar();achievementView();undoBar()
}

function counts(){[["dailyTasks","todayCount"],["weeklyTasks","weeklyCount"],["specificTasks","specificCount"]].forEach(([a,b])=>{let x=[...document.getElementById(a).children].filter(e=>!e.classList.contains("empty"));document.getElementById(b).textContent=x.filter(e=>e.classList.contains("completed")).length+"/"+x.length})}

function progress(){let a=["dailyTasks","weeklyTasks","specificTasks","customTasks"].flatMap(id=>[...document.getElementById(id).children]).filter(e=>!e.classList.contains("empty")),n=a.length,d=a.filter(e=>e.classList.contains("completed")).length,p=n?Math.round(d/n*100):0;progressNumber.textContent=`${d} / ${n}`;progressPercent.textContent=p+"%";progressFill.style.width=p+"%"}

function upcoming(){let a=[],today=new Date();for(let i=1;i<=14;i++){let d=new Date(today);d.setDate(today.getDate()+i);allRecurring().forEach(t=>{if(t.frequency==="specific-days"&&due(t,d))a.push({d,n:t.name})})}customTasks().forEach(t=>{if(t.type==="one-time"){let d=dateFromString(t.dueDate);if(d>today)a.push({d,n:t.name})}});a.sort((x,y)=>x.d-y.d);let c=document.getElementById("upcomingTasks");c.innerHTML="";a.slice(0,15).forEach(x=>{let e=document.createElement("div");e.className="upcoming-item";e.textContent=`${dateString(x.d)} — ${x.n}`;c.append(e)});empty(c,"Nothing upcoming.")}

function historyView(){
let c=document.getElementById("history"),q=document.getElementById("historySearch").value.toLowerCase(),f=document.getElementById("historyFilter").value;
let a=Object.values(history()).filter(x=>!q||x.name.toLowerCase().includes(q)).sort((x,y)=>y.completedOn.localeCompare(x.completedOn));c.innerHTML="";
if(f==="missed"){c.innerHTML='<div class="empty">Missed occurrences are calculated in the calendar.</div>';return}
a.slice(0,200).forEach(x=>{let e=document.createElement("div");e.className="history-item";e.innerHTML=`<span>✓ ${safe(x.name)}</span><span>${x.completedOn}</span>`;c.append(e)});empty(c,"No history found.")
}

function safe(x){return String(x).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}

let calDate=new Date(),selected=dateString();

function calendar(){
let y=calDate.getFullYear(),m=calDate.getMonth(),c=document.getElementById("calendar");document.getElementById("calendarTitle").textContent=new Date(y,m,1).toLocaleDateString(undefined,{month:"long",year:"numeric"});c.innerHTML="";
["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].forEach(x=>{let e=document.createElement("div");e.className="cal-head";e.textContent=x;c.append(e)});
let start=new Date(y,m,1).getDay();for(let i=0;i<42;i++){let d=new Date(y,m,i-start+1),e=document.createElement("div");e.className="cal-day";if(d.getMonth()!=m)e.classList.add("other");if(dateString(d)===dateString())e.classList.add("today");if(dateString(d)===selected)e.classList.add("selected");
let num=document.createElement("div");num.textContent=d.getDate();e.append(num);let dueTasks=allRecurring().filter(t=>due(t,d)),done=dueTasks.filter(t=>completed(t,d));if(done.length){let dot=document.createElement("span");dot.className="cal-dot";e.append(dot)}if(dueTasks.length&&done.length===dueTasks.length){let ck=document.createElement("span");ck.textContent="✓";e.append(ck)}
e.onclick=()=>{selected=dateString(d);calendar();showDay(d)};c.append(e)}showDay(dateFromString(selected),false)
}

function showDay(d,scroll=true){
let b=document.getElementById("dayDetails"),a=allRecurring().filter(t=>due(t,d)),done=a.filter(t=>completed(t,d));b.classList.add("show");b.innerHTML=`<b>${d.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric",year:"numeric"})}</b><br><span class="date">${done.length}/${a.length} due tasks completed</span>`;
if(done.length){let x=document.createElement("div");x.style.marginTop="8px";done.forEach(t=>{let q=document.createElement("div");q.textContent="✓ "+t.name;x.append(q)});b.append(x)}if(scroll)b.scrollIntoView({behavior:"smooth",block:"nearest"})
}

prevMonth.onclick=()=>{calDate.setMonth(calDate.getMonth()-1);calendar()};nextMonth.onclick=()=>{calDate.setMonth(calDate.getMonth()+1);calendar()}

function bestStreak(t){let best=0;if(t.frequency!=="daily"&&t.frequency!=="weekly")return 0;for(let i=0;i<(t.frequency==="daily"?365:52);i++){let d=new Date();d.setDate(d.getDate()-(t.frequency==="daily"?i:i*7));let n=0;while(completed(t,d)){n++;d.setDate(d.getDate()-(t.frequency==="daily"?1:7))}best=Math.max(best,n)}return best}

function stats(){
let h=history(),v=Object.values(h),days={};v.forEach(x=>days[x.completedOn]=(days[x.completedOn]||0)+1);let bd=0,bw=0;
allRecurring().forEach(t=>{let b=bestStreak(t);if(t.frequency==="daily")bd=Math.max(bd,b);if(t.frequency==="weekly")bw=Math.max(bw,b)});
let perfect=Object.keys(days).filter(x=>{let d=dateFromString(x),a=allRecurring().filter(t=>due(t,d));return a.length&&a.every(t=>completed(t,d))}).length;
let todayDue=allRecurring().filter(t=>due(t));return{total:v.length,bestDaily:bd,bestWeekly:bw,perfectDays:perfect,maxDay:Math.max(0,...Object.values(days)),cleanSweep:todayDue.length&&todayDue.every(t=>completed(t))?1:0,undos:Number(localStorage.getItem("undoCount")||0),
shower:v.filter(x=>x.taskId==="shower").length,code:v.filter(x=>x.taskId==="code").length,bible:v.filter(x=>x.taskId==="bible").length,piano:v.filter(x=>x.taskId==="piano-weekly").length,cq:v.filter(x=>x.taskId==="cq").length,weekend:v.filter(x=>[0,6].includes(dateFromString(x.completedOn).getDay())).length}
}

function achievementView(){
let s=stats(),c=document.getElementById("achievements"),n=0;c.innerHTML="";achievements.forEach(a=>{let ok=a[4](s);if(ok)n++;let e=document.createElement("div");e.className="achievement "+(ok?"unlocked":"locked");e.innerHTML=`<div class="achievement-icon">${a[1]}</div><div class="achievement-title">${a[2]}</div><div class="achievement-desc">${a[3]}</div>`;c.append(e)});achievementCount.textContent=`${n}/${achievements.length} unlocked`;statsBox(s)}

function statsBox(s){document.getElementById("stats").innerHTML=`<div class="stat"><b>${s.total}</b>Completions</div><div class="stat"><b>🔥 ${s.bestDaily}</b>Best daily</div><div class="stat"><b>📅 ${s.bestWeekly}</b>Best weekly</div>`}

let known=read("achievementState",{});
function checkAchievements(){let s=stats();achievements.forEach(a=>{let ok=a[4](s);if(ok&&!known[a[0]])toast(`${a[1]} Achievement unlocked: ${a[2]}!`);known[a[0]]=ok});write("achievementState",known)}

function toast(msg){let e=document.createElement("div");e.className="toast";e.textContent=msg;toastBox.append(e);setTimeout(()=>e.remove(),3000)}

const themeGrid=document.getElementById("themeGrid");
Object.entries(themes).forEach(([name,t])=>{let b=document.createElement("button");b.className="theme-btn";b.textContent=name;b.onclick=()=>applyTheme(name);themeGrid.append(b)});

function applyTheme(name){let t=themes[name];Object.entries(t).forEach(([k,v])=>document.documentElement.style.setProperty("--"+k,v));localStorage.setItem("theme",name);document.querySelectorAll(".theme-btn").forEach(b=>b.classList.toggle("active",b.textContent===name))}

themeButton.onclick=()=>themeModal.classList.add("show");closeTheme.onclick=()=>themeModal.classList.remove("show");themeModal.onclick=e=>{if(e.target===themeModal)themeModal.classList.remove("show")}

addButton.onclick=()=>addPanel.classList.toggle("hidden");cancelButton.onclick=()=>addPanel.classList.add("hidden");
taskType.onchange=()=>{dateArea.classList.toggle("hidden",taskType.value!=="one-time");recurringArea.classList.toggle("hidden",taskType.value==="one-time")}
frequency.onchange=()=>{everyDaysArea.classList.toggle("hidden",frequency.value!=="every-days");specificDaysArea.classList.toggle("hidden",frequency.value!=="specific-days")}

saveTaskButton.onclick=()=>{
let name=taskName.value.trim();
if(!name)return alert("Enter a task name.");

let description=document.getElementById("taskDescription").value.trim();

let t={
id:"custom-"+Date.now(),
name,
description,
type:taskType.value
};
if(t.type==="one-time"){if(!dueDate.value)return alert("Choose a due date.");t.dueDate=dueDate.value}
else{t.frequency=frequency.value;if(t.frequency==="every-days"){let n=Number(everyDays.value);if(!n||n<1)return alert("Enter a valid number.");t.interval=n;t.startDate=dateString()}
if(t.frequency==="specific-days"){t.days=[...document.querySelectorAll(".weekday-container input:checked")].map(x=>Number(x.value));if(!t.days.length)return alert("Choose at least one day.")}}
let a=customTasks();
a.push(t);
write("customTasks",a);

taskName.value="";
taskDescription.value="";
dueDate.value="";addPanel.classList.add("hidden");render();toast("Task added ✓")
};

historySearch.oninput=historyView;historyFilter.onchange=historyView;

function dateDisplay(){dateDisplayEl.textContent=new Date().toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric",year:"numeric"})}
const dateDisplayEl=document.getElementById("dateDisplay");
let lastDate=dateString();setInterval(()=>{let d=dateString();if(d!==lastDate){lastDate=d;dateDisplay();render()}},30000);
applyTheme(localStorage.getItem("theme")||"Midnight");dateDisplay();render();
</script>
</body>
</html>
